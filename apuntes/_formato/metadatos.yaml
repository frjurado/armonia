# Formato común a todas las unidades. Cada unidad declara en su cabecera
# solo lo suyo (title, subtitle); lo que declare ahí gana sobre esto.
#
# Los nombres de variable son los de la plantilla Typst de Pandoc
# (`pandoc -D typst`): cambiarlos por gusto rompe el PDF.

lang: es
papersize: a4
margin:
  x: 3cm
  y: 2.5cm
# «Armonia Serif» no está instalada en ningún sitio: vive en el repo,
# en fuentes/, y Typst la encuentra porque construir.py le pasa
# --font-path. Es DejaVu Serif recortada y con dos arreglos —el
# circunflejo de los grados y las alteraciones—, y ahí, en
# fuentes/regenerar.py, está el porqué de cada uno con sus medidas.
#
# DejaVu de partida, y no Georgia ni Constantia, porque los grados
# (1̂, 5̂, ♯7̂) son dígito + circunflejo combinante (U+0302) y casi ninguna
# fuente de texto lo compone siquiera: Georgia deja el acento suelto
# detrás del número, y Constantia lo compone en redonda pero lo PIERDE
# en negrita, que es peor porque no se nota. DejaVu lo trae en los dos
# pesos y numera con cifras de caja alta (Constantia las usa
# elzevirianas y su cero parece una «o»: «UD 0» se leía «UD o»).
#
# Antes de tocar esta línea: compilar y mirar «**4̂ → 3̂**» en negrita.
mainfont: Armonia Serif
fontsize: 10.5pt   # esta fuente pesa más que una Garamond
linestretch: 1.15
page-numbering: "1"
figure-caption-position: bottom

# El pie de figura, más pequeño y gris, como en el HTML (apuntes.css):
# explica lo que hay que mirar en el ejemplo, pero no es el texto.
# Va como bloque typst en bruto porque la plantilla de Pandoc no tiene
# variable para esto; en el HTML, Pandoc lo descarta solo.
header-includes:
  - |
    ```{=typst}
    #show figure.caption: set text(size: 8.8pt, fill: rgb("#666666"))
    ```
