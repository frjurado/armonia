# Publica el sitio en GitHub Pages con cada push a master.
# Requisito único (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Los apuntes necesitan LilyPond y se añadirán aquí cuando haya
      # material: instalar lilypond, `make -C apuntes ejemplos`, renderizar
      # el HTML a apuntes/build/sitio/. montar.sh ya los recoge si existen.

      - name: Montar _site/
        run: sh sitio/montar.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
