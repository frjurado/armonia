# Publica el sitio en GitHub Pages: la rama `publico` en la raíz (lo que
# ven los alumnos) y `master` en dev/ (desarrollo). Un solo artefacto, con
# cada push a cualquiera de las dos ramas.
# Requisito único (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar

on:
  push:
    branches: [master, publico]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: publico, path: publico }
      - uses: actions/checkout@v4
        with: { ref: master, path: master }

      # --- apuntes -----------------------------------------------------
      # Requisitos de apuntes/herramientas/construir.py. Ubuntu 24.04 trae
      # LilyPond 2.24 y Pandoc 3.1, que valen; Typst no está en apt y
      # **hace falta el binario**: `pip install typst` instala solo el
      # módulo de Python, y Pandoc llama al ejecutable.
      - name: Instalar LilyPond, Pandoc y Typst
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond pandoc poppler-utils
          python3 -m pip install --quiet fonttools   # solo para el aviso de cobertura
          curl -sSLf "https://github.com/typst/typst/releases/download/v${TYPST}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          lilypond --version | head -1; pandoc --version | head -1; typst --version
        env:
          TYPST: 0.14.2

      # Cada rama construye los suyos. Se comprueba que el script exista
      # porque `publico` puede ir por detrás y no tenerlo todavía; sin
      # apuntes/build/sitio/, montar.sh sigue adelante sin la carpeta.
      - name: Construir los apuntes de cada rama
        run: |
          for rama in publico master; do
            if [ -f "$rama/apuntes/herramientas/construir.py" ]; then
              echo "== apuntes de $rama"
              python3 "$rama/apuntes/herramientas/construir.py"
            else
              echo "== $rama todavía no trae apuntes"
            fi
          done

      - name: Montar _site/ (publico) y _site/dev/ (master)
        run: |
          sh publico/sitio/montar.sh "$PWD/_site" publico
          sh master/sitio/montar.sh  "$PWD/_site/dev" dev

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
