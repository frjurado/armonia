<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armonía · Familia 2 — Audición de intervalos</title>
<!-- Verovio (render de partitura, WASM) y soundfont-player (audio por samples) desde CDN.
     En producción se empaquetarían en local para uso offline. -->
<script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
<script src="mini-lilypond-parser.js"></script>
<script src="familia2-intervalos-core.js"></script>
<script src="comun.js"></script>
<link rel="stylesheet" href="comun.css">
</head>
<body>
<header>
  <h1>Audición de intervalos</h1>
  <span class="sub">Familia 2 · Unidad 1</span>
  <a class="back" href="../index.html">← Menú</a>
  <span class="level">Nivel <b id="lvl">1</b></span>
</header>

<main>
  <p class="prompt">Escucha el intervalo e indica su <b>tipo</b> (consonancia perfecta /
     consonancia imperfecta / disonancia) y su <b>amplitud</b> (p. ej. "3.ª"). La partitura
     se muestra al revelar la respuesta. <span id="lvlNote"></span></p>

  <div class="ej-row">
    <div class="ej-main">
      <div class="score-card"><div id="notation"><span class="ph">Cargando motor de audio…</span></div></div>
      <div class="answer" id="answer">
        <div class="q" id="ansQuality">—</div>
        <div class="det" id="ansDetail"></div>
      </div>
    </div>
    <div class="controls">
      <button id="btnListen" class="primary" title="Escuchar de nuevo"><span class="ic">▶</span>Escuchar</button>
      <button id="btnReveal" title="Mostrar la respuesta y la partitura"><span class="ic">✓</span>Respuesta</button>
      <div class="sep"></div>
      <button id="btnSimilar" style="display:none" title="Otro ejercicio del mismo nivel"><span class="ic">↻</span>Similar</button>
      <button id="btnHarder"  style="display:none" title="Otro ejercicio, un nivel más difícil"><span class="ic">↑</span>Más difícil</button>
    </div>
  </div>
</main>

<script>
/* ============================================================
   UI / RENDER / AUDIO — versión de audición
   ------------------------------------------------------------
   Diferencia con la versión de identificación: NO se muestra la
   partitura al generar (solo suena); se muestra recién al revelar
   la respuesta (Generador-ejercicios.md §4.2).
   La generación musical vive en familia2-intervalos-core.js,
   compartida con la versión de identificación.
   ============================================================ */
const PH_LISTEN = '<span class="ph"><span class="icon">🔊</span>Escucha e identifica el intervalo</span>';
let tk=null, level=1, current=null, revealed=false;
const $=ArmoniaEj.$;

function renderSVG(){
  if(tk && current && revealed){
    tk.loadData(current.mei);
    $('notation').innerHTML = tk.renderToSVG(1);
  }
}

function newExercise(){
  current = Familia2.generate(level);
  revealed = false;
  $('lvl').textContent = level;
  $('lvlNote').textContent = Familia2.LVL_NOTES[level] || '';
  $('notation').innerHTML = PH_LISTEN;
  $('answer').className='answer';
  $('btnReveal').disabled=false;
  $('btnSimilar').style.display='none';
  $('btnHarder').style.display='none';
  playInterval();   // suena automáticamente al generar, SIN mostrar la partitura
}

function reveal(){
  if(!current) return;
  revealed = true;
  renderSVG();
  // Aquí, al revés que en la versión de identificación: primero y grande el tipo
  // (consonancia/disonancia), después y más discreto el intervalo concreto.
  const cat = current.category[0].toUpperCase()+current.category.slice(1);
  $('ansQuality').textContent = cat;
  let q = current.label;
  if(current.compoundLabel){
    q += ` <span class="compound">(${current.compoundLabel})</span>`;
  }
  $('ansDetail').innerHTML = q;
  $('answer').className='answer show';
  $('btnReveal').disabled=true;
  $('btnSimilar').style.display='';
  $('btnHarder').style.display = level<Familia2.MAX_NIVEL ? '' : 'none';
}

async function playInterval(){
  if(!current) return;
  try{
    await ArmoniaEj.tocar(current.notes.map(n=>({midi:Familia2.midiOf(n.letter,n.alter,n.oct)})));
  }catch(e){
    ArmoniaEj.audioNoDisponible($('btnListen'));
  }
}

$('btnReveal').onclick = reveal;
$('btnSimilar').onclick = ()=>newExercise();
$('btnHarder').onclick = ()=>{ level=Math.min(level+1,Familia2.MAX_NIVEL); newExercise(); };
$('btnListen').onclick = playInterval;

// Primer ejercicio inmediato (texto + botones funcionan ya, sin esperar a Verovio)
newExercise();

// Sin partitura hasta revelar: si Verovio no carga, no hace falta avisar aquí.
ArmoniaEj.initVerovio({scale:60, pageWidth:900}, t=>{ tk=t; renderSVG(); });
</script>
</body>
</html>
